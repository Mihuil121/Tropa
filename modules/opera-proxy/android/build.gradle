plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.operaproxy'
version = '0.1.0'

android {
  namespace "expo.modules.operaproxy"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  implementation project(':expo-modules-core')
}
